[workspace]
resolver = "2"
members = [
  "crates/vpn_contracts",
  "crates/vpn_service_core",
  "services/windows_vpn_service",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
